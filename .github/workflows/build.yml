name: Build Mobile Release

on:
  push:
    branches: [main, mobile]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias moxitv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass moxi123456 \
            -keypass moxi123456 \
            -dname "CN=MoXiTV, OU=MoXi, O=MoXi, L=Beijing, ST=Beijing, C=CN"

      - name: Create local.properties
        run: |
          echo "storeFile=release.keystore" >> local.properties
          echo "keyAlias=moxitv" >> local.properties
          echo "storePassword=moxi123456" >> local.properties

      - name: Build Mobile Release (arm64-v8a)
        run: ./gradlew assembleMobileArm64_v8aRelease 2>&1 | tee build-arm64.log

      - name: Build Mobile Release (armeabi-v7a)
        run: ./gradlew assembleMobileArmeabi_v7aRelease 2>&1 | tee build-armv7a.log

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          retention-days: 7

      - name: Collect APKs
        run: |
          mkdir -p output
          find app/build/outputs/apk -name "mobile-*.apk" -exec cp {} output/ \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MoXiTV-Mobile-Release
          path: output/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true