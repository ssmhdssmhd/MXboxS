name: Build MXboxS Release

on:
  push:
    branches: [main, mobile, upstream-sync]
    tags:
      - 'v*'
    paths-ignore:
      - 'LICENSE'
      - '.upstream-sync-baseline'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.upstream-sync-baseline'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # NOTE: GitHub-hosted ubuntu-latest already ships a full Android SDK.
      # android-actions/setup-android is intentionally NOT used — running it
      # breaks this workflow (the action fails early when we request
      # build-tools with a non-existent version, causing 14s failures).
      - name: Verify pre-installed Android SDK
        run: |
          set -e
          echo "ANDROID_HOME      = ${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT  = ${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -n "$SDK" ] && [ -d "$SDK" ]; then
            echo "--- SDK dir (maxdepth 3) ---"
            find "$SDK" -maxdepth 3 -type d | sort | head -80
            echo "--- sdkmanager: list installed ---"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SM" ] || SM="$SDK/cmdline-tools/tools/bin/sdkmanager"
            [ -x "$SM" ] || SM="$SDK/tools/bin/sdkmanager"
            if [ -x "$SM" ]; then
              yes 2>/dev/null | "$SM" --list_installed 2>/dev/null | head -40 || echo "(sdkmanager exited non-zero, ignoring)"
            else
              echo "(sdkmanager binary not found at the expected locations)"
            fi
          else
            echo "ERROR: no pre-installed Android SDK found on this runner!"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Verify Keystore (fixed)
        run: |
          set -e
          ls -la app/release.keystore
          keytool -list -v -keystore app/release.keystore \
            -storepass mxboxs123456 -alias mxboxs 2>&1 | grep -E "SHA1|SHA256|Valid from"

      - name: Create local.properties
        run: |
          set -e
          # NOTE: we intentionally do NOT write sdk.dir here — AGP 8.x reads
          # ANDROID_HOME / ANDROID_SDK_ROOT env vars set by the runner.
          cat > local.properties <<'EOF'
          storeFile=release.keystore
          keyAlias=mxboxs
          storePassword=mxboxs123456
          keyPassword=mxboxs123456
          EOF
          echo "=== local.properties ==="
          cat local.properties

      - name: Print Gradle / Java / Android env
        run: |
          set +e
          ./gradlew --version --no-daemon 2>&1 | head -30
          RC=$?
          echo "--- gradlew --version exit: $RC ---"
          echo "=== Relevant ENV ==="
          env | grep -iE "android|java|gradle|sdk|home" || echo "(no env vars matched)"
          echo "=== Disk free ==="
          df -h .
          # Exit 0 regardless; the build step will fail for real if Gradle is broken.
          true

      - name: Build Mobile arm64-v8a (Phone)
        run: |
          set -o pipefail
          ./gradlew assembleMobileArm64_v8aRelease --stacktrace --no-daemon 2>&1 | tee build-mobile-arm64.log
          echo "=== APKs after this build ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true

      - name: Build Mobile armeabi-v7a (Phone)
        run: |
          set -o pipefail
          ./gradlew assembleMobileArmeabi_v7aRelease --stacktrace --no-daemon 2>&1 | tee build-mobile-armeabi.log
          echo "=== APKs after this build ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true

      - name: Build Leanback arm64-v8a (Android TV)
        run: |
          set -o pipefail
          ./gradlew assembleLeanbackArm64_v8aRelease --stacktrace --no-daemon 2>&1 | tee build-leanback-arm64.log
          echo "=== APKs after this build ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true

      - name: Build Leanback armeabi-v7a (Android TV)
        run: |
          set -o pipefail
          ./gradlew assembleLeanbackArmeabi_v7aRelease --stacktrace --no-daemon 2>&1 | tee build-leanback-armeabi.log
          echo "=== APKs after this build ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true

      - name: Upload Build Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
            **/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Debug APK paths
        if: always()
        run: |
          echo "=== APK output directory structure ==="
          find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== All files in outputs ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory"

      - name: Collect APKs
        run: |
          set -e
          mkdir -p output
          APKS=$(find app/build/outputs/apk -type f -name "MXboxS-*.apk" 2>/dev/null || true)
          if [ -z "$APKS" ]; then
            echo "(MXboxS-*.apk not found, falling back to any *.apk)"
            APKS=$(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true)
          fi
          if [ -z "$APKS" ]; then
            echo "ERROR: no APKs at all — Gradle build probably failed."
            exit 1
          fi
          echo "Found APKs:"
          echo "$APKS"
          ls -la $APKS
          cp -v $APKS output/
          echo "=== Final output/ ==="
          ls -la output/

      - name: Upload APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MXboxS-Release-APKs
          path: output/
          retention-days: 30
          compression-level: 6

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
