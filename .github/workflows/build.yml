name: Build MoXiTV Release

on:
  push:
    branches: [main, mobile]
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK (Platform 37 + Build Tools)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0 build-tools;34.0.0 cmdline-tools;latest'
          license_accept: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias moxitv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass moxi123456 \
            -keypass moxi123456 \
            -dname "CN=MoXiTV, OU=MoXi, O=MoXi, L=Beijing, ST=Beijing, C=CN"

      - name: Create local.properties
        run: |
          echo "storeFile=release.keystore" >> local.properties
          echo "keyAlias=moxitv" >> local.properties
          echo "storePassword=moxi123456" >> local.properties
          echo "keyPassword=moxi123456" >> local.properties
          [ -n "$ANDROID_HOME" ] && echo "sdk.dir=$ANDROID_HOME" >> local.properties || true

      - name: Build Leanback arm64-v8a (TV)
        run: set -o pipefail && ./gradlew assembleLeanbackArm64_v8aRelease 2>&1 | tee build-leanback-arm64.log

      - name: Build Mobile arm64-v8a (Phone)
        run: set -o pipefail && ./gradlew assembleMobileArm64_v8aRelease 2>&1 | tee build-mobile-arm64.log

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          retention-days: 7

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p output
          APKS=$(find app/build/outputs -name "*.apk" 2>/dev/null)
          if [ -n "$APKS" ]; then
            echo "Found APKs:"
            echo "$APKS"
            cp -v $APKS output/ 2>/dev/null || true
          else
            echo "ERROR: No APK files found!"
          fi
          echo "=== Output directory ==="
          ls -la output/ 2>/dev/null || echo "Output directory empty"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoXiTV-Release-APKs
          path: output/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true