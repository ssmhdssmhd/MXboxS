name: Build MXboxS Release

on:
  push:
    branches: [main, mobile]
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'yes'
          # NOTE: compileSdk/targetSdk can be 37 but build-tools have independent versioning.
          # Latest stable build-tools is 34.x; AGP 8.x will auto-download the exact bt it needs.
          packages: 'platform-tools platforms;android-37 build-tools;34.0.0 cmdline-tools;latest'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Generate Keystore
        run: |
          set -e
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias mxboxs \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mxboxs123456 \
            -keypass mxboxs123456 \
            -dname "CN=MXboxS, OU=MXboxS, O=MXboxS, L=Shenzhen, ST=Guangdong, C=CN"
          ls -la app/release.keystore

      - name: Create local.properties
        run: |
          set -e
          echo "storeFile=release.keystore" >> local.properties
          echo "keyAlias=mxboxs" >> local.properties
          echo "storePassword=mxboxs123456" >> local.properties
          echo "keyPassword=mxboxs123456" >> local.properties
          # android-actions/setup-android@v4 may set either env var
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -n "$SDK_DIR" ]; then
            echo "sdk.dir=$SDK_DIR" >> local.properties
            echo "Using SDK dir: $SDK_DIR"
            [ -d "$SDK_DIR" ] && echo "SDK dir exists: $(ls $SDK_DIR | head -5)" || echo "WARNING: SDK dir not found on disk!"
          else
            echo "WARNING: Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set!"
            ls -la $HOME/Android/ 2>/dev/null || true
            ls -la /usr/local/lib/android/ 2>/dev/null || true
          fi
          echo "=== local.properties ==="
          cat local.properties

      - name: Inspect Android SDK installation
        run: |
          set -e
          echo "ANDROID_HOME: ${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -n "$SDK" ] && [ -d "$SDK" ]; then
            echo "--- SDK tree (top 2 levels) ---"
            find "$SDK" -maxdepth 3 -type d | sort | head -60
            echo "--- sdkmanager list installed ---"
            yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null \
              || "$SDK/cmdline-tools/tools/bin/sdkmanager" --list_installed 2>/dev/null \
              || echo "(sdkmanager not available, skipping)"
          else
            echo "No SDK env/dir available"
          fi

      - name: Print Gradle / Java env
        run: |
          set -e
          ./gradlew --version 2>&1 | head -30 || echo "gradlew --version failed (will retry later)"
          echo "=== ENV (android/java/gradle/sdk) ==="
          env | grep -iE "android|java|gradle|sdk|home" || echo "(no matching env vars)"

      - name: Build Mobile arm64-v8a (Phone)
        run: |
          set -o pipefail
          ./gradlew assembleMobileArm64_v8aRelease --stacktrace --no-daemon 2>&1 | tee build-mobile-arm64.log
          echo "=== Find APKs ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true

      - name: Build Mobile armeabi-v7a (Phone)
        run: |
          set -o pipefail
          ./gradlew assembleMobileArmeabi_v7aRelease --stacktrace --no-daemon 2>&1 | tee build-mobile-armeabi.log
          echo "=== Find APKs ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true

      - name: Build Leanback arm64-v8a (Android TV)
        run: |
          set -o pipefail
          ./gradlew assembleLeanbackArm64_v8aRelease --stacktrace --no-daemon 2>&1 | tee build-leanback-arm64.log
          echo "=== Find APKs ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true

      - name: Build Leanback armeabi-v7a (Android TV)
        run: |
          set -o pipefail
          ./gradlew assembleLeanbackArmeabi_v7aRelease --stacktrace --no-daemon 2>&1 | tee build-leanback-armeabi.log
          echo "=== Find APKs ==="
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true

      - name: Upload Build Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
            **/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect APKs
        run: |
          set -e
          mkdir -p output
          echo "=== Search APKs (any) ==="
          find app/build -name "*.apk" -ls 2>/dev/null || true
          echo "=== Collect MXboxS-*.apk ==="
          APKS=$(find app/build/outputs/apk -name "MXboxS-*.apk" 2>/dev/null || true)
          if [ -z "$APKS" ]; then
            echo "(MXboxS-*.apk not found, fallback to any APK)"
            APKS=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null || true)
          fi
          if [ -n "$APKS" ]; then
            echo "Found APKs:"
            echo "$APKS"
            ls -la $APKS
            cp -v $APKS output/ 2>/dev/null || true
          else
            echo "ERROR: No APK files found at all!"
            exit 1
          fi
          echo "=== Output directory ==="
          ls -la output/
          [ "$(ls -A output/ 2>/dev/null | wc -l)" -gt 0 ] || exit 1

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MXboxS-Release-APKs
          path: output/
          retention-days: 30
          compression-level: 6

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true