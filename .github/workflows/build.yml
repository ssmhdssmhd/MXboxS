name: Build MXboxs APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [ leanback, mobile ]
        abi: [ arm64_v8a, armeabi_v7a ]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate debug keystore and local.properties
        run: |
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          cat > local.properties <<PROPS
          storeFile=debug.keystore
          keyAlias=androiddebugkey
          storePassword=android
          PROPS

      - name: Build MXboxs ${{ matrix.flavor }}-${{ matrix.abi }} APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          ./gradlew assemble${{ matrix.flavor }}${{ matrix.abi }}Release --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXboxs-${{ matrix.flavor }}-${{ matrix.abi }}
          path: app/build/outputs/apk/**/release/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all APKs
        run: find artifacts -name "*.apk" -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true