name: Build MXboxS Release

on:
  push:
    branches: [main, mobile]
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'yes'
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias mxboxs \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mxboxs123456 \
            -keypass mxboxs123456 \
            -dname "CN=MXboxS, OU=MXboxS, O=MXboxS, L=Shenzhen, ST=Guangdong, C=CN"

      - name: Create local.properties
        run: |
          echo "storeFile=release.keystore" >> local.properties
          echo "keyAlias=mxboxs" >> local.properties
          echo "storePassword=mxboxs123456" >> local.properties
          echo "keyPassword=mxboxs123456" >> local.properties
          [ -n "$ANDROID_HOME" ] && echo "sdk.dir=$ANDROID_HOME" >> local.properties || true
          [ -n "$ANDROID_SDK_ROOT" ] && echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties || true

      - name: Build Mobile arm64-v8a (Phone)
        run: set -o pipefail && ./gradlew assembleMobileArm64_v8aRelease 2>&1 | tee build-mobile-arm64.log

      - name: Build Mobile armeabi-v7a (Phone)
        run: set -o pipefail && ./gradlew assembleMobileArmeabi_v7aRelease 2>&1 | tee build-mobile-armeabi.log

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          retention-days: 7

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p output
          APKS=$(find app/build/outputs -name "*.apk" 2>/dev/null)
          if [ -n "$APKS" ]; then
            echo "Found APKs:"
            echo "$APKS"
            cp -v $APKS output/ 2>/dev/null || true
          else
            echo "ERROR: No APK files found!"
          fi
          echo "=== Output directory ==="
          ls -la output/ 2>/dev/null || echo "Output directory empty"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MXboxS-Release-APKs
          path: output/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true