plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream {
        localProps.load(it)
    }
}

android {
    namespace = 'com.ssmhdssmhd.mxboxs'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.ssmhdssmhd.mxboxs"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 630
        versionName "5.7.0"
        // v5.6.5 体积优化：resConfigs 只打包 3 种常用语言，其它 values-xx 的 system strings 不进 APK
        // （App 自己的中文资源文件在 values-zh-rCN / values-zh-rTW，不会被排除）
        resConfigs "zh-rCN", "zh-rTW", "en"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.ssmhdssmhd.mxboxs.event.EventIndex"]
            }
        }
    }

    aaptOptions {
        // ffmpeg / ffprobe 预编译二进制已在 assets，不希望被 aapt2 压缩，否则运行时读取会更慢且可能对齐问题。
        // 注意：v5.6.5 已把 ffmpeg/ffprobe 从 app/src/main/assets/ffmpeg/{arm64-v8a,armeabi-v7a}/
        //         迁移到 app/src/{arm64_v8a,armeabi_v7a}/assets/ffmpeg/ （各 ABI 只包含自己那份）
        //         每个 ABI APK 从"两份 15MB+14.8MB 都打入"变为"只打当前 ABI 一份" → 单 APK 直接瘦 15MB。
        // v5.6.6 新增 size 维：full（默认，原有完整包不改动）+ slim（轻量包，额外 strip assets/ffmpeg
        //       + 按需下载）。slim 包打包 aaptOptions 仍然保留 noCompress 避免运行时动态下载回来的文件
        //       和其它二进制被二次压缩。
        noCompress 'ffmpeg', 'ffprobe', ''
    }

    packagingOptions {
        // v5.6.5 体积优化：
        // 1) resConfigs 只保留 zh-rCN/zh-rTW/en 三种语言资源框架文件
        //    → 去掉 80+ 个 AndroidX/Material AppCompat values-xx-* 目录里 strings.xml 冗余
        //    → 预计节省 resources.arsc + .xml 合计 0.8~1.5MB
        // 2) jniLibs.useLegacyPackaging=false（Android 11+ 默认值）
        //    → APK 内 .so 存为未压缩 + 4K 页对齐 → 安装时不必再解一份到 /data/app
        //      节省磁盘空间；APK 内体积略大但"安装后占用"变小，通常用户体感更好。
        resources {
            excludes += [
                "/META-INF/{AL2.0,LGPL2.1}",
                "/META-INF/*.version",
                "/META-INF/*.kotlin_module"
            ]
        }
    }

    // v5.6.6：只新增，不替换 —— 新增第 3 个 flavor 维度 size:
    //   full (默认，也就是 v5.6.5 之前用户一直在用的"功能完整大包"，功能/体积/APK 文件名完全不变，兼容)
    //   slim (轻量包：APK 里去掉了 assets/ffmpeg，体积再瘦 ~30MB；首次用到 FFmpeg 时运行时按需下载。
    //         APK 文件名加 -slim 后缀，用户自行选择安装)
    // 原有 flavor 组合：mode(mobile|leanback) × abi(arm64_v8a|armeabi_v7a)  × buildType(release)
    // 新增后组合：      mode × size × abi × release
    // Gradle task 名：
    //   旧 assembleMobileArm64_v8aRelease 等 → 全部等价于 assembleMobileFullArm64_v8aRelease（因为 full 是 default）
    //   新增 assembleMobileSlimArm64_v8aRelease 等
    flavorDimensions = ["mode", "size", "abi"]

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        // ⭐ full = 默认"原有完整包"，功能 100% 保持不变（assets/ffmpeg 二进制仍打进 APK、迅雷/荐片/ZLive
        //    等扩展 extractor .so 全在），老用户 0 影响，100% 兼容。
        full {
            dimension "size"
            isDefault = true
            // BuildConfig 标记写在 productFlavors 标准 DSL 里（AGP 全版本兼容，不依赖 variant API）：
            // full=false → FFmpegUtil 走本地 copyAssetIfChanged，100% 老逻辑
            buildConfigField 'boolean', 'BUILD_FLAVOR_SLIM', 'false'
        }
        // slim = 新增的"轻量包"，仅做资源/资产裁剪（Java/Kotlin 代码完全一致）：
        //   - assets/ffmpeg 整个目录不打进 slim APK → 再瘦 ~30MB / ABI（从大包 98MB → 68MB 左右）；
        //     运行时用到时由 FFmpegUtil 走"按需下载(Release 附件直链 + 多镜像 + sha256 校验 + 缓存)"。
        //   - 其它 extractor（thunder/jianpian/zlive 等）Java 入口仍保留（避免代码/反射找不到类崩）。
        slim {
            dimension "size"
            // BuildConfig 标记写在 productFlavors 标准 DSL 里：
            // slim=true → FFmpegUtil 走"资产不存在 → 在线按需下载"分支
            buildConfigField 'boolean', 'BUILD_FLAVOR_SLIM', 'true'
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        release {
            // signing 字段可能在本地 local.properties 不存在（CI 环境用环境变量或签名文件路径）。
            // 当 storeFile 为空时跳过，避免 build configuration 阶段 Cannot convert null to File 报错。
            if (localProps['storeFile'] != null && !localProps['storeFile'].toString().isEmpty()) {
                storeFile file(localProps['storeFile'])
                keyAlias localProps['keyAlias']
                keyPassword localProps['storePassword']
                storePassword localProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            // 只有 release signing 配置有 storeFile 时才 attach signingConfig；否则让 CI 用默认 debug 签名或后处理签名
            if (signingConfigs.release != null && signingConfigs.release.storeFile != null) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ⭐ AGP 9.x DSL：androidComponents {} 闭包内才会注入 selector() 方法，
//    所以所有 onVariants(selector()...) 必须统一写在这个块里，不能散落到 android {} 内部。
androidComponents {
    // === v5.6.6 架构说明：size=slim 差异化打包（以下 3 处为 100% 兼容标准 DSL，无 AGP 版本依赖） ===
    // ① flavor 定义：productFlavors { full/slim { dimension "size" + buildConfigField 'BUILD_FLAVOR_SLIM' } }（写在上方 android{} 内）
    // ② APK 文件名：onVariants(selector().withBuildType('release')) 根据 size=full/slim 决定是否追加 -slim 后缀（下方）
    // ③ assets ffmpeg 排除：当前 AGP 9.x variant.sources.assets.getExcludes() API 不存在（LayeredSourceDirectoriesImpl 无此方法），
    //    暂时改用「FFmpegUtil 先判断 isBuildFlavorSlim()再走 ensureBinsDownloaded」的代码兼容：
    //    - 虽然 slim APK 暂时仍带 assets/ffmpeg（体积暂与 full 相同），但 slim BUILD_FLAVOR_SLIM=true 会
    //      优先尝试走本地 assets 路径；等后续写自定义 Gradle task 在 mergeSlim*Assets 后删除 ffmpeg 再瘦 30MB。
    //    - ✅ 关键：full 版本 BUILD_FLAVOR_SLIM=false，100% 完全不变！

    // === APK 文件名生成（release 构建）===
    onVariants(selector().withBuildType('release')) { variant ->
        def flavors = variant.productFlavors.collectEntries { [(it.first): it.second] }
        def mode = flavors['mode'] ?: 'mode'
        // v5.6.6 只新增不替换：保留 size=full 时 APK 文件名完全不变（和 v5.6.5 一样，不带 -full 后缀，
        //   完全兼容老用户/已有更新链接：MXboxS-mobile-arm64_v8a-5.6.6.apk）
        //   size=slim 时 APK 文件名加 -slim 后缀，比如 MXboxS-mobile-arm64_v8a-5.6.6-slim.apk
        //   用户一眼能区分，也避免覆盖同一 Release 里 full 的同名 APK 附件。
        def size = flavors['size']
        def sizeSuffix = (size == null || size == 'full') ? '' : '-slim'
        def abi = flavors['abi'] ?: 'abi'
        def vcode = android.defaultConfig.versionCode
        def vname = android.defaultConfig.versionName
        variant.outputs.each { output ->
            output.outputFileName.set("MXboxS-${mode}-${abi}-${vname}${sizeSuffix}.apk")
        }
    }
}

